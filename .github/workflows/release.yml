name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump'
        type: choice
        default: patch
        options: [patch, minor, major]

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, 'publish')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
          cache: npm

      - name: Determine next version
        id: version
        run: |
          BUMP="${{ inputs.bump || 'auto' }}"
          if [ "$BUMP" = "auto" ]; then
            MSG=$(git log -1 --pretty=%B | tr '[:upper:]' '[:lower:]')
            if echo "$MSG" | grep -q 'publish major\|#major'; then
              BUMP=major
            elif echo "$MSG" | grep -q 'publish minor\|#minor'; then
              BUMP=minor
            else
              BUMP=patch
            fi
          fi
          NEXT=$(node -e "
            const [maj, min, pat] = require('./package.json').version.split('.').map(Number);
            const b = '$BUMP';
            if (b === 'major') console.log(\`\${maj + 1}.0.0\`);
            else if (b === 'minor') console.log(\`\${maj}.\${min + 1}.0\`);
            else console.log(\`\${maj}.\${min}.\${pat + 1}\`);
          ")
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Releasing v$NEXT ($BUMP)"

      - name: Make packages publishable
        run: |
          node -e "
            const fs = require('fs'), path = require('path');
            const dir = 'packages';
            for (const d of fs.readdirSync(dir)) {
              const p = path.join(dir, d, 'package.json');
              if (!fs.existsSync(p)) continue;
              const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
              if (pkg.private !== undefined) {
                delete pkg.private;
                fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n');
                console.log('publishable:', pkg.name);
              }
            }
          "

      - name: Install dependencies
        run: npm ci

      # packages/cli-native/assets/ and create-native/assets/template are
      # gitignored (generated by sync-assets.mjs); without this step the packed
      # tarballs ship without navigation/Router.kt, gradle template, or samples.
      - name: Sync packaged assets
        run: npm run build:assets

      - name: Build and publish to npm
        run: node scripts/release.mjs "${{ steps.version.outputs.version }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Bump root version, commit and tag
        run: |
          V="${{ steps.version.outputs.version }}"
          node -e "
            const p = require('./package.json');
            p.version = '$V';
            require('fs').writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          "
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(release): v$V [skip ci]"
          git tag -a "v$V" -m "v$V"
          git push origin HEAD:"${{ github.ref_name }}" --follow-tags

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "v${{ steps.version.outputs.version }}" --title "v${{ steps.version.outputs.version }}" --generate-notes --verify-tag
